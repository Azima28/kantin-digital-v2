services:
  # 1. Database PostgreSQL Production
  postgres:
    image: postgres:16-alpine
    container_name: kantin_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      TZ: Asia/Jakarta
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema only. The row data lives in database_backup/full_backup_data.sql,
      # which is gitignored because it contains real accounts and password
      # hashes -- restore it manually after the volume is created:
      #   docker compose exec -T postgres psql -U postgres -d kantin_digital < database_backup/full_backup_data.sql
      - ./database_backup/init_postgres_standalone.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      # Loopback only: the api container reaches postgres over kantin_network,
      # so this mapping exists purely for local psql/pgAdmin access. Never bind
      # it to 0.0.0.0 -- that puts the whole database, password hashes included,
      # in front of every host on the network.
      - "127.0.0.1:5432:5432"
    networks:
      - kantin_network

  # 2. Golang API Backend (REST & WebSocket)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kantin_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-72}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      UPLOAD_DIR: "/app/uploads"
      APP_ENV: ${APP_ENV:-production}
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - kantin_network

  # 3. Flutter Web Frontend (Nginx Gateway)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: kantin_web
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./build/web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - kantin_network

networks:
  kantin_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
