<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SeKantin - Smart Efficiency Kantin (RFID/NFC Cashless Canteen Ecosystem)">

  <!-- iOS meta tags & icons -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SeKantin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicons (High-Resolution & Multi-Size) -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=3"/>
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=3"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=3"/>
  <link rel="shortcut icon" href="favicon.ico?v=3"/>
  <link rel="icon" type="image/png" href="favicon.png?v=3"/>

  <!-- Preconnect & bundled font stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <title>SeKantin</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Synchronously check user theme mode preference before initial paint
    // Default is Light Mode (White background); Dark only if explicitly set to 'dark'
    try {
      var t = localStorage.getItem('flutter.kantin_digital_theme_mode') || localStorage.getItem('kantin_digital_theme_mode');
      if (t === 'dark') {
        document.documentElement.classList.add('dark-theme');
      }
    } catch (e) {}
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #FFFFFF;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      transition: background-color 0.3s ease;
    }
    .dark-theme body,
    body.dark-theme {
      background-color: #0B1120 !important;
    }
    .dark-theme .app-title {
      color: #F8FAFC !important;
    }
    .dark-theme .app-subtitle {
      color: #94A3B8 !important;
    }
    .dark-theme .logo-img.light {
      display: none !important;
    }
    .dark-theme .logo-img.dark {
      display: block !important;
    }
    #loading-splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      transition: opacity 0.4s ease-out;
    }
    .logo-img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 18px;
      filter: drop-shadow(0 8px 24px rgba(13, 148, 136, 0.2));
      animation: pulse 2.2s infinite ease-in-out;
    }
    .logo-img.dark {
      display: none;
    }
    .logo-img.light {
      display: block;
    }
    .app-title {
      font-size: 22px;
      font-weight: 800;
      color: #0F172A;
      letter-spacing: -0.5px;
      margin: 0 0 6px 0;
    }
    .app-subtitle {
      font-size: 13px;
      color: #64748B;
      margin: 0 0 24px 0;
      font-weight: 500;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(13, 148, 136, 0.15);
      border-top-color: #0D9488;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <img src="images/symbol_light.png" class="logo-img light" alt="SeKantin Logo" />
    <img src="images/symbol_dark.png" class="logo-img dark" alt="SeKantin Logo" />
    <h1 class="app-title">SeKantin</h1>
    <p class="app-subtitle">Smart Efficiency Kantin</p>
    <div class="spinner"></div>
  </div>
  <script>
    // Force unregister stale service workers and clear browser cache storage on each release
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) {
          caches.delete(names[i]);
        }
      });
    }

    // Dynamic cache-busting loader for flutter_bootstrap.js
    var v = Date.now();
    var s = document.createElement('script');
    s.src = 'flutter_bootstrap.js?v=' + v;
    s.async = true;
    document.body.appendChild(s);
  </script>
</body>
</html>
